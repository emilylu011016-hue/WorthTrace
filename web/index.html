<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>邮箱验证成功 · 钱迹 WorthTrace</title>
  <style>
    :root {
      --champagne: #f5efe5;
      --graphite: #202520;
      --sage: #778575;
      --soft-gold: #c8b37a;
      --warm-line: #d8cebe;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--champagne);
      color: var(--graphite);
      font-family: -apple-system, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      padding: 24px;
    }
    .card {
      max-width: 420px;
      width: 100%;
      background: #fffdf8;
      border: 1px solid var(--warm-line);
      border-radius: 16px;
      padding: 40px 32px;
      text-align: center;
    }
    .mark {
      width: 56px;
      height: 56px;
      margin: 0 auto 20px;
      border-radius: 14px;
      background: var(--champagne);
      border: 1px solid var(--warm-line);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--sage);
    }
    h1 { font-size: 22px; font-weight: 600; margin-bottom: 12px; }
    p { font-size: 14px; line-height: 1.8; color: var(--sage); }
    .divider {
      height: 1px;
      background: var(--warm-line);
      margin: 24px 0 16px;
    }
    .foot { font-size: 12px; color: var(--soft-gold); }
  </style>
</head>
<body>
  <main class="card">
    <div class="mark" aria-hidden="true">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M20 6 9 17l-5-5" />
      </svg>
    </div>
    <h1>邮箱验证成功</h1>
    <p>这个邮箱已经完成验证。<br />请回到钱迹 WorthTrace（电脑端或手机端），<br />用邮箱和密码登录即可开始同步。</p>
    <div class="divider"></div>
    <p class="foot">钱迹 WorthTrace · worthtrace.org</p>
  </main>
</body>
</html>
